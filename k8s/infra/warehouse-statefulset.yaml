apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: warehouse
  namespace: infra
spec:
  serviceName: warehouse
  replicas: 1
  selector:
    matchLabels:
      app: warehouse
  template:
    metadata:
      labels:
        app: warehouse
    spec:
      containers:
        - name: postgres
          image: postgres
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: earthquakes_prod
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: warehouse-credentials
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /opt/program/tables.sql
              subPath: tables.sql
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d/config.sh
              subPath: config.sh
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: warehouse-data
        - name: init-scripts
          configMap:
            name: warehouse-init
            defaultMode: 0755
